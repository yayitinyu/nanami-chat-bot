name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -q

  image-check:
    needs: test
    if: github.event_name == 'pull_request'
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
    with:
      output: image
      # Native runners: linux/amd64 -> ubuntu-24.04, linux/arm64 -> ubuntu-24.04-arm.
      # setup-qemu stays false so nothing is emulated.
      setup-qemu: false
      distribute: true
      platforms: linux/amd64,linux/arm64
      cache: true
      push: false
      sign: "false"
      meta-images: ghcr.io/${{ github.repository }}
      set-meta-labels: true
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=sha,prefix=sha-
  image-publish:
    needs: test
    if: github.event_name != 'pull_request'
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    with:
      output: image
      # Native runners: linux/amd64 -> ubuntu-24.04, linux/arm64 -> ubuntu-24.04-arm.
      # setup-qemu stays false so nothing is emulated.
      setup-qemu: false
      distribute: true
      platforms: linux/amd64,linux/arm64
      cache: true
      push: true
      sbom: true
      sign: auto
      meta-images: ghcr.io/${{ github.repository }}
      set-meta-labels: true
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=sha,prefix=sha-
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
