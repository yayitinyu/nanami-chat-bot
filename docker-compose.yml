services:
  bot:
    build: .
    image: ${BOT_IMAGE:-ghcr.io/yayitinyu/nanami-chat-bot:latest}
    container_name: nanami-chat-bot
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.db
      TZ: ${TZ:-Asia/Shanghai}
      # Host publish port still comes from WEBHOOK_PORT in .env (see ports).
      # The process inside the container must listen on 8080, which is what
      # the published mapping targets. Without this override, setting
      # WEBHOOK_PORT=28080 makes the app bind 28080 while Docker forwards to 8080.
      WEBHOOK_PORT: "8080"
      # The optional Turnstile page uses a separate internal listener.
      CHALLENGE_PORT: "8081"
    volumes:
      - bot-data:/app/data
    ports:
      - "${WEBHOOK_BIND:-127.0.0.1}:${WEBHOOK_PORT:-8080}:8080"
      - "${CHALLENGE_BIND:-127.0.0.1}:${CHALLENGE_PORT:-8081}:8081"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
