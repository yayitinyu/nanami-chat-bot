services:
  bot:
    build: .
    image: ghcr.io/yayitinyu/nanami-chat-bot:latest
    container_name: nanami-chat-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.db
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - bot-data:/app/data
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
